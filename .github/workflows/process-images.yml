# .github/workflows/process-images.yml
name: Process Costume Images

on:
  workflow_dispatch:  # 手动触发
    inputs:
      days:
        description: '处理多少天内的图片'
        required: false
        default: '7'

jobs:
  process-images:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create output directory
        run: mkdir -p costume_icons

      - name: Process images
        run: node scripts/process-images.mjs ${{ github.event.inputs.days || '7' }}
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add costume_icons/
          git diff --staged --quiet || git commit -m "🎨 Auto-processed costume images [skip ci]"
          git push