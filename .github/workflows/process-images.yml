# .github/workflows/process-images.yml
name: Process Costume Images

on:
  workflow_dispatch:
    inputs:
      hours:
        description: '处理多少小时内的图片'
        required: false
        default: '168'  # 默认7天 = 168小时

jobs:
  process-images:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 移除 cache 选项

      - name: Install dependencies
        run: npm install  # 改用 npm install

      - name: Create output directory
        run: mkdir -p costume_icons

      - name: Process images
        run: node scripts/process-images.mjs
        env:
          HOURS: ${{ github.event.inputs.hours || '168' }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add costume_icons/
          git diff --staged --quiet || git commit -m "🎨 Auto-processed costume images [skip ci]"
          git push