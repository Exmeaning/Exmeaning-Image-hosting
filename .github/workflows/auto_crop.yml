name: Auto Crop Images

on:
  schedule:
    # 每天 UTC 时间 00:00 运行 (北京时间 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许手动点击按钮触发，方便测试

permissions:
  contents: write # 授予 GITHUB_TOKEN 写权限以便推送更改

jobs:
  crop-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 获取完整的提交历史，有时候对 git 操作更安全，但在大仓库可以用默认值
          fetch-depth: 1 

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Crop Images
        run: |
          echo "Starting crop process..."
          
          # 处理 costume_icons 目录
          if [ -d "costume_icons" ]; then
            echo "Processing costume_icons..."
            # 使用 find 配合 xargs 处理，效率更高且支持文件名带空格
            # -trim: 自动裁剪周围颜色相同的区域（这里指透明背景）
            # +repage: 重置画布大小，移除裁剪后的偏移量信息
            find costume_icons -name "*.png" -print0 | xargs -0 -I {} mogrify -trim +repage "{}"
          else
            echo "Directory costume_icons not found."
          fi

          # 处理 base_chibis 目录
          if [ -d "base_chibis" ]; then
            echo "Processing base_chibis..."
            find base_chibis -name "*.png" -print0 | xargs -0 -I {} mogrify -trim +repage "{}"
          else
            echo "Directory base_chibis not found."
          fi

      - name: Commit and Push changes
        run: |
          # 配置 git 用户为 github-actions[bot]
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 检查是否有文件发生了变化
          if [[ -n $(git status -s) ]]; then
            echo "Changes detected. Committing..."
            
            git add costume_icons base_chibis
            git commit -m "Auto: Crop transparent borders from images"
            
            # 使用默认的 GITHUB_TOKEN 推送
            # 这通常不会触发 rate limit，因为是每日一次的操作
            git push
          else
            echo "No changes detected. Skipping push."
          fi
