name: Auto Crop Images


permissions:
  contents: write

jobs:
  crop-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Crop Images
        run: |
          echo "Starting crop process..."
          
          # 定义一个函数来处理裁剪，避免代码重复
          # 查找目录下的 png 和 webp 文件，并对其执行裁剪
          process_dir() {
            local dir=$1
            if [ -d "$dir" ]; then
              echo "Processing $dir..."
              # 解释: 
              # -type f: 只查找文件
              # \( ... \): 组合条件
              # -o: 逻辑或 (OR)，即名字是 png 或者 webp
              find "$dir" -type f \( -name "*.png" -o -name "*.webp" \) -print0 | xargs -0 -I {} mogrify -trim +repage "{}"
            else
              echo "Directory $dir not found."
            fi
          }

          # 分别处理两个目录
          process_dir "costume_icons"
          process_dir "base_chibis"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 检查是否有文件发生了变化
          if [[ -n $(git status -s) ]]; then
            echo "Changes detected. Committing..."
            
            # 添加所有变更（包含修改后的 webp 和 png）
            git add costume_icons base_chibis
            git commit -m "Auto: Crop transparent borders from PNG and WebP images"
            
            git push
          else
            echo "No changes detected. Skipping push."
          fi
